<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IronLog</title>
<meta name="description" content="Registro personal de entrenos y pesos. Offline-first con copia en la nube.">
<meta name="theme-color" content="#07080a">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IronLog">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060708;--bg2:#0b0d10;--card:#111317;--card2:#16191e;--field:#0a0c0f;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --text:#f3f5f8;--mute:#8d95a1;--dim:#5d646f;
  --lime:#c8ff2e;--blue:#2e8bff;--purple:#a35bff;--red:#ff3b4f;--amber:#ffb020;--gold:#ffd23f;--green:#35e38c;
  --day:var(--lime);
  --r:18px;--nav:66px;--safe-b:env(safe-area-inset-bottom,0px);
  --display:'Bebas Neue','Oswald',Impact,'Arial Narrow',sans-serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(900px 520px at 50% -240px,rgba(200,255,46,.07),transparent 65%),var(--bg);padding-bottom:calc(var(--nav) + var(--safe-b) + 24px);overflow-x:hidden}
body.timer-on{padding-bottom:calc(var(--nav) + var(--safe-b) + 104px)}
body.modal-open{overflow:hidden}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--mute)} .dim{color:var(--dim)}
[hidden]{display:none!important}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;letter-spacing:.7px;margin:0;line-height:1}
h2{font-size:28px} h3{font-size:22px}
p{margin:.4em 0}
a{color:var(--lime)}

/* ---------- Header ---------- */
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:rgba(6,7,8,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-size:29px;letter-spacing:1.2px;line-height:1;white-space:nowrap}
.logo b{color:var(--lime);font-weight:400;text-shadow:0 0 18px rgba(200,255,46,.55)}
.weekchip{font-family:var(--display);font-size:17px;letter-spacing:1px;padding:4px 8px 3px;border-radius:8px;border:1px solid var(--line2);color:var(--mute);white-space:nowrap}
.sync{margin-left:auto;display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;font-size:12.5px;font-weight:700;border:1px solid var(--line2);color:var(--mute);background:rgba(255,255,255,.03);white-space:nowrap;max-width:62vw;overflow:hidden;text-overflow:ellipsis;transition:all .3s}
.sync .dot{flex:none;width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.sync span:last-child{overflow:hidden;text-overflow:ellipsis}
.sync.ok{color:var(--green);border-color:rgba(53,227,140,.35);background:rgba(53,227,140,.08)}
.sync.pending{color:var(--amber);border-color:rgba(255,176,32,.38);background:rgba(255,176,32,.08)}
.sync.off{color:#b8c0cc;border-color:rgba(184,192,204,.3)}
.sync.err{color:var(--red);border-color:rgba(255,59,79,.4);background:rgba(255,59,79,.09)}
.sync.busy{color:var(--blue);border-color:rgba(46,139,255,.4);background:rgba(46,139,255,.08)}
.sync.busy .dot,.sync.pending .dot{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}

main{max-width:760px;margin:0 auto;padding:16px}

/* ---------- Cards ---------- */
.card{position:relative;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 12px 32px rgba(0,0,0,.38)}
#view.anim .card,#view.anim .stat{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.card::before{content:'';position:absolute;inset:0;background:radial-gradient(420px 170px at 0% 0%,color-mix(in srgb,var(--day) 13%,transparent),transparent 70%);pointer-events:none}
.card>*{position:relative}
.card.glow{border-color:color-mix(in srgb,var(--day) 35%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 1px color-mix(in srgb,var(--day) 12%,transparent),0 14px 44px color-mix(in srgb,var(--day) 14%,rgba(0,0,0,.4))}
.card h2+.sub,.card h3+.sub{margin-top:4px}
.sub{color:var(--mute);font-size:14px}
.kicker{font-size:11.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--day)}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 4px 10px}
.sec-title h2{font-size:26px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#view.anim>.card:nth-child(2){animation-delay:.04s}#view.anim>.card:nth-child(3){animation-delay:.08s}#view.anim>.card:nth-child(4){animation-delay:.12s}#view.anim>.card:nth-child(5){animation-delay:.16s}

/* ---------- Buttons & fields ---------- */
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);font-weight:700;font-size:15px;transition:transform .12s,background .2s,box-shadow .25s,border-color .2s;user-select:none;-webkit-user-select:none;text-align:center}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:rgba(255,255,255,.22)}
.btn.primary{background:var(--day);color:#05060a;border-color:transparent;box-shadow:0 8px 26px color-mix(in srgb,var(--day) 38%,transparent)}
.btn.big{width:100%;min-height:60px;font-family:var(--display);font-size:25px;letter-spacing:1.4px;font-weight:400}
.btn.danger{color:var(--red);border-color:rgba(255,59,79,.35);background:rgba(255,59,79,.06)}
.btn.danger-solid{background:var(--red);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.right{margin-left:auto}
.stack>*+*{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
input,select,textarea{font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s;min-height:46px}
textarea{min-height:64px;resize:vertical;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:var(--day);box-shadow:0 0 0 3px color-mix(in srgb,var(--day) 22%,transparent)}
input[type=checkbox]{width:24px;height:24px;min-height:0;accent-color:var(--lime)}
label.f{display:block;font-size:11.5px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin:14px 0 6px}
.hint{font-size:13px;color:var(--mute)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.06);color:#c3c9d2;border:1px solid var(--line);white-space:nowrap}
.tag.grip{color:var(--day);border-color:color-mix(in srgb,var(--day) 35%,transparent);background:color-mix(in srgb,var(--day) 10%,transparent)}
.tag.gold{color:var(--gold);border-color:rgba(255,210,63,.35);background:rgba(255,210,63,.08)}
.pill{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--day);box-shadow:0 0 10px var(--day)}
.banner{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:16px;margin-bottom:14px;background:rgba(255,176,32,.08);border:1px solid rgba(255,176,32,.35);color:#ffe2a8;font-size:14px;animation:rise .35s both}
.banner.red{background:rgba(255,59,79,.08);border-color:rgba(255,59,79,.4);color:#ffc2c9}
.banner .btn{flex:none}

/* ---------- Bottom nav ---------- */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;background:rgba(8,9,11,.93);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.bottom .in{display:flex;width:100%;max-width:760px}
nav.bottom button{flex:1;min-width:0;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.3px;position:relative;transition:color .2s}
nav.bottom svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
nav.bottom button.on{color:var(--lime)}
nav.bottom button.on svg{transform:translateY(-1px);filter:drop-shadow(0 0 8px rgba(200,255,46,.6))}
nav.bottom button.on::before{content:'';position:absolute;top:0;width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--lime);box-shadow:0 0 12px var(--lime)}

/* ---------- Hoy ---------- */
.hero{padding:20px 18px}
.hero h1{font-size:64px;line-height:.9;margin-top:6px;color:var(--day);text-shadow:0 0 30px color-mix(in srgb,var(--day) 45%,transparent)}
.hero .dname{font-family:var(--display);font-size:26px;letter-spacing:.8px;margin-top:4px}
.hero .focus{font-size:13.5px;color:var(--mute);margin-top:4px}
.preview{list-style:none;margin:16px 0 18px;padding:0}
.preview li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.preview li .i{font-family:var(--display);font-size:20px;color:var(--day);width:22px;text-align:center;flex:none}
.preview li .n{flex:1;min-width:0}
.preview li .n small{display:block;color:var(--mute);font-size:12.5px}
.preview li .r{font-weight:700;font-size:13.5px;white-space:nowrap;text-align:right}
.preview li .r small{display:block;color:var(--mute);font-weight:500;font-size:12px}
.cdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--dim)}
.cdot.go{background:var(--green);box-shadow:0 0 10px var(--green)}
.cdot.hold{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.cdot.warn{background:var(--red);box-shadow:0 0 10px var(--red)}
.cdot.new{background:var(--blue);box-shadow:0 0 10px var(--blue)}
.daychips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.daychip{flex:1;min-width:90px;min-height:46px;border-radius:13px;border:1px solid color-mix(in srgb,var(--day) 40%,transparent);background:color-mix(in srgb,var(--day) 8%,transparent);color:var(--day);font-family:var(--display);font-size:20px;letter-spacing:1px;transition:all .2s}
.daychip.on{background:var(--day);color:#05060a;box-shadow:0 0 20px color-mix(in srgb,var(--day) 45%,transparent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:12px}
.stat .v{font-family:var(--display);font-size:30px;line-height:1;letter-spacing:.5px}
.stat .l{font-size:11px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-top:4px}
.prog{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:99px;background:var(--day);box-shadow:0 0 12px var(--day);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.segs{display:flex;gap:4px;margin-top:10px}
.segs i{flex:1;height:8px;border-radius:3px;background:rgba(255,255,255,.08)}
.segs i.done{background:var(--lime);box-shadow:0 0 8px rgba(200,255,46,.5)}
.segs i.cur{background:linear-gradient(90deg,var(--lime),rgba(200,255,46,.25));animation:pulse 1.6s infinite}

/* ---------- Sesión activa ---------- */
.sess-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:20;margin:-16px -16px 14px;padding:12px 16px;background:linear-gradient(180deg,rgba(6,7,8,.96),rgba(6,7,8,.88));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in srgb,var(--day) 30%,transparent)}
.sess-head .t{display:flex;align-items:baseline;gap:10px}
.sess-head .t h2{color:var(--day);font-size:30px}
.sess-head .t .el{margin-left:auto;font-family:var(--display);font-size:26px;letter-spacing:1px}
.sess-head .prog{margin-top:8px}
.ex{padding:14px}
.ex-h{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.ex-idx{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-size:21px;background:color-mix(in srgb,var(--day) 15%,transparent);color:var(--day);border:1px solid color-mix(in srgb,var(--day) 40%,transparent)}
.ex.complete .ex-idx{background:var(--day);color:#05060a}
.ex-h h3{font-family:var(--sans);font-weight:800;font-size:17px;letter-spacing:0;line-height:1.25}
.ex-h .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.coach{display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.035);border:1px solid var(--line);font-size:13.5px}
.coach b{display:block;font-size:14.5px}
.lights{display:flex;flex-direction:column;gap:4px;padding:6px 5px;border-radius:9px;background:#050607;border:1px solid var(--line);flex:none}
.lights i{width:10px;height:10px;border-radius:50%;background:#1d2127}
.coach.go .lights i:nth-child(3){background:var(--green);box-shadow:0 0 10px var(--green)}
.coach.hold .lights i:nth-child(2){background:var(--amber);box-shadow:0 0 10px var(--amber)}
.coach.warn .lights i:nth-child(1){background:var(--red);box-shadow:0 0 10px var(--red)}
.coach.new .lights i{background:rgba(46,139,255,.5)}
.coach.go b{color:var(--green)} .coach.hold b{color:var(--amber)} .coach.warn b{color:var(--red)} .coach.new b{color:var(--blue)}
.last{margin-top:10px;font-size:13px;color:var(--mute)}
.last b{color:#d9dee5;font-weight:700}
.sets{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.setrow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line);text-align:left;transition:background .2s,border-color .2s}
.setrow .sn{font-family:var(--display);font-size:22px;width:20px;color:var(--mute)}
.setrow .sv{flex:1;font-weight:700;font-size:16px}
.setrow .srir{font-size:12.5px;color:var(--mute);font-weight:600}
.setrow .ck{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:800;border:1.5px solid var(--line2);color:var(--dim);flex:none}
.setrow.done{border-color:color-mix(in srgb,var(--day) 28%,transparent);background:color-mix(in srgb,var(--day) 7%,transparent)}
.setrow.done .sn{color:var(--day)}
.setrow.done .ck{background:var(--day);border-color:transparent;color:#05060a}
.setrow.done.just .ck{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.setrow.done.just{animation:glowin .9s ease-out}
@keyframes glowin{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--day) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.setopen{padding:14px;border-radius:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--day) 9%,#0d0f12),#0d0f12);border:1px solid color-mix(in srgb,var(--day) 45%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--day) 10%,transparent);animation:rise .25s both}
.so-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.so-h .t{font-family:var(--display);font-size:22px;letter-spacing:1px;color:var(--day)}
.so-h .l{font-size:12.5px;color:var(--mute)}
.lbl{font-size:11px;font-weight:800;color:var(--mute);letter-spacing:.9px;text-transform:uppercase;margin:12px 0 6px}
.stepper{display:grid;grid-template-columns:46px 46px 1fr 46px 46px;gap:6px}
.stepper.reps{grid-template-columns:64px 1fr 64px}
.stepper button{height:58px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);font-weight:800;font-size:14.5px;transition:transform .1s,background .15s}
.stepper button:active{transform:scale(.93);background:color-mix(in srgb,var(--day) 22%,var(--card2))}
.stepper.reps button{font-size:24px}
.stepper input{height:58px;text-align:center;font-size:28px;font-weight:800;padding:0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.rir{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rir button{height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);font-weight:800;font-size:15px}
.rir button.on{background:var(--day);color:#05060a;border-color:transparent}
.so-actions{display:flex;gap:8px;margin-top:14px}
.so-actions .btn.primary{flex:1;min-height:60px;font-family:var(--display);font-size:24px;letter-spacing:1.3px;font-weight:400}
.ex-foot{display:flex;gap:8px;margin-top:10px;align-items:stretch}
.ex-foot textarea{min-height:46px;height:46px;flex:1}
.ex-foot .btn{flex:none}
.sess-actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:6px}

/* ---------- Timer ---------- */
.timer{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safe-b) + 10px);transform:translate(-50%,160%);width:min(728px,calc(100% - 20px));z-index:35;display:flex;align-items:center;gap:8px;padding:10px 10px 12px 14px;border-radius:18px;background:rgba(17,19,23,.97);border:1px solid color-mix(in srgb,var(--day) 40%,transparent);box-shadow:0 14px 44px rgba(0,0,0,.65),0 0 30px color-mix(in srgb,var(--day) 15%,transparent);transition:transform .4s cubic-bezier(.2,.9,.3,1.15);overflow:hidden}
.timer.show{transform:translate(-50%,0)}
.timer .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--day);box-shadow:0 0 10px var(--day);transition:width .25s linear}
.timer .tt{display:flex;flex-direction:column;min-width:0;flex:1}
.timer .tl{font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:var(--mute);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .tv{font-family:var(--display);font-size:36px;line-height:1;letter-spacing:1px;color:var(--day)}
.timer .btn{min-height:44px;padding:0 12px}
.timer.done{animation:tflash .6s ease-in-out 5}
.timer.done .tv{color:var(--green)}
@keyframes tflash{50%{background:color-mix(in srgb,var(--day) 35%,#111317)}}

/* ---------- Historial ---------- */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h h3{font-size:24px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:11px;font-weight:800;color:var(--dim);padding:4px 0}
.cd{aspect-ratio:1;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--mute);background:rgba(255,255,255,.025);border:1px solid transparent;position:relative}
.cd.has{color:#05060a;background:var(--day);box-shadow:0 0 14px color-mix(in srgb,var(--day) 45%,transparent)}
.cd.today{border-color:var(--lime)}
.cd.empty{background:none}
.cd .n2{position:absolute;top:3px;right:5px;font-size:9px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}
.sitem{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-bottom:8px;border-radius:15px;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-left:4px solid var(--day);text-align:left;transition:transform .15s}
.sitem:active{transform:scale(.99)}
.sitem .d{font-family:var(--display);font-size:20px;color:var(--day);width:44px;line-height:1;text-align:center}
.sitem .d small{display:block;font-family:var(--sans);font-size:10.5px;font-weight:700;color:var(--mute)}
.sitem .m{flex:1;min-width:0}
.sitem .m b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem .m span{font-size:12.5px;color:var(--mute)}
.sitem .x{text-align:right;font-size:13px;font-weight:700;white-space:nowrap}
.sitem .x small{display:block;color:var(--mute);font-weight:500}

/* ---------- Detalle sesión ---------- */
.dex{padding:12px 0;border-top:1px solid var(--line)}
.dex-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.dex-h b{font-size:15px}
.dt{width:100%;border-collapse:separate;border-spacing:0 6px}
.dt td{padding:0 3px;vertical-align:middle}
.dt td.sn{font-family:var(--display);font-size:20px;color:var(--day);width:22px}
.dt input,.dt select{min-height:44px;padding:8px 6px;text-align:center;font-weight:700}
.dt .u{font-size:12px;color:var(--mute);white-space:nowrap}
.dt .del{width:40px;height:44px;border-radius:11px;border:1px solid rgba(255,59,79,.3);color:var(--red)}

/* ---------- Progreso ---------- */
.gbar{margin-top:12px}
.gbar .gh{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
.gbar .gh b{font-weight:700}
.gbar .gh span{color:var(--mute)}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.medal{border-radius:15px;padding:12px 10px;text-align:center;background:radial-gradient(120px 70px at 50% 0%,rgba(255,210,63,.13),transparent 70%),rgba(255,255,255,.03);border:1px solid rgba(255,210,63,.22)}
.medal .ic{font-size:22px}
.medal .v{font-family:var(--display);font-size:26px;color:var(--gold);line-height:1.05;margin-top:2px}
.medal .l{font-size:10.5px;font-weight:800;letter-spacing:.6px;color:var(--mute);text-transform:uppercase}
.medal .d{font-size:11px;color:var(--dim);margin-top:2px}
.seg{display:flex;padding:4px;border-radius:13px;background:#0a0c0f;border:1px solid var(--line);gap:4px}
.seg button{flex:1;min-height:38px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--mute);transition:all .2s}
.seg button.on{background:var(--day);color:#05060a}
.chartbox{position:relative;height:230px;margin-top:12px}
.chartbox .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:14px;text-align:center;padding:20px}
.recrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;width:100%;text-align:left}
.recrow .n{flex:1;min-width:0}
.recrow .n small{display:block;color:var(--mute);font-size:12px}
.recrow .v{font-weight:800;color:var(--gold);white-space:nowrap;text-align:right}
.recrow .v small{display:block;color:var(--mute);font-weight:500;font-size:12px}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.hrow span:first-child{color:var(--mute);white-space:nowrap}
.hrow span:last-child{text-align:right}

/* ---------- Ajustes / rutina ---------- */
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--mute)}
.kv span:last-child{text-align:right;font-weight:600}
.ok{color:var(--green)} .bad{color:var(--red)} .warn{color:var(--amber)}
.snap{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.snap .grow{font-weight:600}
.ritem{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.ritem .n{flex:1;min-width:0;font-size:14.5px}
.ritem .n small{display:block;color:var(--mute);font-size:12.5px}
.ritem .ib{width:40px;height:40px;border-radius:11px;border:1px solid var(--line2);background:var(--card2);font-weight:800;flex:none}
.ritem .ib.del{color:var(--red);border-color:rgba(255,59,79,.3)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid transparent}
.swatches button.on{border-color:#fff;box-shadow:0 0 14px var(--c)}
.bwrow{display:grid;grid-template-columns:1fr 1.3fr auto;gap:8px}
.bwrow input{min-width:0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
pre.sql{max-height:46vh;overflow:auto;background:#050607;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;line-height:1.45;white-space:pre;color:#cfe8a0}

/* ---------- Modal / toasts ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .22s}
.overlay.in{opacity:1}
.sheet{position:relative;width:100%;max-width:640px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#15181d,#0e1013);border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + var(--safe-b));transform:translateY(40px);transition:transform .3s cubic-bezier(.2,.9,.3,1);box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.overlay.in .sheet{transform:none}
.sheet.small{max-width:440px}
.sheet.wide{max-width:720px}
.sheet-x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.06);font-size:16px;color:var(--mute);z-index:2}
.sheet h2{padding-right:44px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:24px;border-bottom:1px solid var(--line2)}}
.confirm p{color:#c9cfd8;margin:12px 0 18px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + var(--safe-b) + 14px);z-index:80;display:flex;flex-direction:column;gap:8px;width:min(560px,calc(100% - 24px));pointer-events:none}
body.timer-on #toasts{bottom:calc(var(--nav) + var(--safe-b) + 96px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:15px;background:#1b1f25;border:1px solid var(--line2);box-shadow:0 12px 36px rgba(0,0,0,.55);font-size:14.5px;font-weight:600;opacity:0;transform:translateY(12px) scale(.98);transition:all .25s cubic-bezier(.2,.9,.3,1.2)}
.toast.in{opacity:1;transform:none}
.toast span{flex:1}
.toast button{flex:none;min-height:38px;padding:0 14px;border-radius:10px;background:var(--lime);color:#05060a;font-weight:800}
.toast.err{border-color:rgba(255,59,79,.5);background:#2a1216}
.toast.ok{border-color:rgba(53,227,140,.4)}

/* ---------- Celebración ---------- */
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
.burst{position:fixed;left:50%;top:38%;z-index:91;transform:translate(-50%,-50%) scale(.6);opacity:0;text-align:center;pointer-events:none;padding:22px 26px;border-radius:24px;background:radial-gradient(circle at 50% 30%,rgba(255,210,63,.25),rgba(10,11,13,.94) 70%);border:1px solid rgba(255,210,63,.5);box-shadow:0 0 80px rgba(255,210,63,.35);animation:burst 2.8s cubic-bezier(.2,1.2,.3,1) forwards;min-width:240px}
.burst .md{font-size:58px;line-height:1;filter:drop-shadow(0 0 18px rgba(255,210,63,.7));animation:spin 1s ease-out}
.burst .t{font-family:var(--display);font-size:38px;color:var(--gold);letter-spacing:1.5px;margin-top:6px}
.burst .d{font-size:14px;color:#f1e3b0;font-weight:600}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}20%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(.96)}}
@keyframes spin{from{transform:rotateY(0) scale(.4)}to{transform:rotateY(720deg) scale(1)}}
.flash{position:fixed;inset:0;z-index:89;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(255,210,63,.35),transparent 60%);animation:fl .9s ease-out forwards}
@keyframes fl{from{opacity:1}to{opacity:0}}
.prlist li{margin:6px 0}
.cmp{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.cmp .n{flex:1;min-width:0}
.up{color:var(--green);font-weight:800}.down{color:var(--red);font-weight:800}.eq{color:var(--mute);font-weight:800}


/* ---------- Sesión: ejercicio actual y completados ---------- */
.ex{scroll-margin-top:150px}
.ex.current{border-color:color-mix(in srgb,var(--day) 60%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--day) 35%,transparent),0 0 46px color-mix(in srgb,var(--day) 24%,transparent),0 18px 44px rgba(0,0,0,.5)}
.ex.current .ex-h h3{font-size:19px}
.nowtag{display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:1.5px;padding:3px 9px;border-radius:6px;background:var(--day);color:#05060a;margin-bottom:8px;box-shadow:0 0 16px color-mix(in srgb,var(--day) 60%,transparent)}
.ex.upnext{opacity:.74;padding:12px 14px}
.ex.upnext::before{opacity:.35}
.ex.upnext .ex-h h3{font-size:15.5px}
.ex.leaving{max-height:0!important;opacity:0;transform:translateY(22px) scale(.95);margin-bottom:0;padding-top:0;padding-bottom:0;border-width:0;overflow:hidden;transition:max-height .46s cubic-bezier(.4,0,.2,1),opacity .3s ease,transform .46s cubic-bezier(.4,0,.2,1),margin .46s,padding .46s}
.ex.enter-current{animation:focusin .75s cubic-bezier(.2,.8,.2,1)}
@keyframes focusin{0%{transform:scale(.97);opacity:.6}55%{transform:scale(1.012);opacity:1}100%{transform:none}}
.done-sec{margin:24px 0 10px}
.done-h{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:21px;letter-spacing:1px;color:var(--dim);margin:0 4px 8px}
.done-h span{font-family:var(--sans);font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.06)}
.done-row{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 12px;margin-bottom:6px;border-radius:12px;background:#0d0f12;border:1px solid rgba(255,255,255,.05);color:var(--mute);font-size:13.5px;text-align:left;opacity:.58;transition:opacity .2s}
.done-row:active,.done-row:hover{opacity:.85}
.done-row .ck{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;background:#2a2e35;color:#9aa1ab}
.done-row .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.done-row .v{white-space:nowrap;font-variant-numeric:tabular-nums}
.done-row.arrive{animation:arrive .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes arrive{from{opacity:0;transform:translateY(-16px)}to{opacity:.58;transform:none}}
.ex.donecard{background:#0f1114;box-shadow:none;border-color:rgba(255,255,255,.06)}
.ex.donecard::before{display:none}
.ex.donecard .ex-idx{background:#2a2e35;color:#9aa1ab;border-color:transparent}
/* ---------- Motor de progresión ---------- */
.rec{margin-top:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.rec-top{display:flex;gap:12px;align-items:center}
.rec .lab{font-size:10px;font-weight:800;letter-spacing:1.3px;color:var(--dim);text-transform:uppercase}
.rec .act{font-family:var(--display);font-size:26px;letter-spacing:1px;line-height:1;margin-top:2px}
.rec .main{font-weight:800;font-size:15px;margin-top:3px}
.rec.go .act{color:var(--green)}.rec.hold .act{color:var(--amber)}.rec.warn .act{color:var(--red)}.rec.new .act{color:var(--blue)}.rec.deload .act{color:#7fd3ff}
.rec.go .lights i:nth-child(3){background:var(--green);box-shadow:0 0 10px var(--green)}
.rec.hold .lights i:nth-child(2){background:var(--amber);box-shadow:0 0 10px var(--amber)}
.rec.warn .lights i:nth-child(1){background:var(--red);box-shadow:0 0 10px var(--red)}
.rec.new .lights i,.rec.deload .lights i{background:rgba(46,139,255,.55)}
.rec-why{margin:10px 0 0;padding:0;list-style:none;font-size:13px;color:#c3c9d2}
.rec-why li{padding:3px 0 3px 16px;position:relative}
.rec-why li::before{content:'›';position:absolute;left:3px;color:var(--day);font-weight:900}
.conf{flex:none;text-align:right;font-size:10.5px;color:var(--mute);font-weight:700;line-height:1.35}
.conf .bars{display:flex;gap:3px;justify-content:flex-end;margin-bottom:4px}
.conf .bars i{width:6px;height:14px;border-radius:2px;background:#262a31}
.conf .bars i.on{background:var(--day);box-shadow:0 0 6px var(--day)}
.plateau{margin-top:10px;padding:10px;border-radius:12px;border:1px dashed rgba(255,176,32,.45);background:rgba(255,176,32,.06);font-size:13px;color:#ffe2a8}
.plateau .row{margin-top:8px;flex-wrap:wrap;gap:6px}
.linkbtn{font-size:13.5px;font-weight:800;color:var(--day);padding:6px 2px}
.recline{margin-top:8px;font-size:13px;color:var(--mute)}.recline b{color:#d9dee5}
/* ---------- Coach ---------- */
.coach-hd{display:flex;gap:14px;align-items:center}
.avatar{flex:none;width:60px;height:60px;border-radius:19px;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 30% 25%,rgba(200,255,46,.32),rgba(46,139,255,.14) 60%,#0b0d10);border:1px solid rgba(200,255,46,.45);box-shadow:0 0 26px rgba(200,255,46,.25),inset 0 0 18px rgba(200,255,46,.12)}
.avatar svg{width:36px;height:36px;filter:drop-shadow(0 0 6px rgba(200,255,46,.6))}
.avatar.sm{width:32px;height:32px;border-radius:10px;box-shadow:0 0 12px rgba(200,255,46,.2)}
.avatar.sm svg{width:20px;height:20px}
.avatar .on{position:absolute;right:-4px;bottom:-4px;width:15px;height:15px;border-radius:50%;background:var(--green);border:3px solid #121418;box-shadow:0 0 10px var(--green)}
.avatar .on.off{background:var(--dim);box-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:42px;padding:0 15px;border-radius:999px;border:1px solid var(--line2);background:var(--card2);font-size:14.5px;font-weight:700;transition:all .15s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--day);color:#05060a;border-color:transparent;box-shadow:0 0 14px color-mix(in srgb,var(--day) 45%,transparent)}
.chip.rec{border-color:color-mix(in srgb,var(--day) 60%,transparent);color:var(--day)}
.chip.rec.on{color:#05060a}
.chip.sm{min-height:32px;padding:0 11px;font-size:12.5px}
.chat{display:flex;flex-direction:column;gap:10px;margin:4px 0 12px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:94%;animation:rise .3s both}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:10px 13px;border-radius:16px;border-bottom-left-radius:5px;font-size:14.5px;line-height:1.45;background:#171a20;border:1px solid var(--line2);overflow-wrap:anywhere;min-width:0}
.msg.me .bubble{background:color-mix(in srgb,var(--lime) 13%,#121418);border-color:rgba(200,255,46,.35);border-radius:16px;border-bottom-right-radius:5px}
.bubble p{margin:0 0 6px}.bubble p:last-child{margin:0}
.bubble ul{margin:4px 0 6px;padding-left:18px}.bubble li{margin:2px 0}
.bubble small{display:block;margin-top:6px;color:var(--dim);font-size:11px}
.typing{display:flex;gap:4px;align-items:center;min-height:38px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--lime);animation:typing 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes typing{0%,80%,100%{opacity:.2;transform:none}40%{opacity:1;transform:translateY(-4px)}}
.chatbox{display:flex;gap:8px;align-items:flex-end}
.chatbox textarea{min-height:48px;height:48px;max-height:140px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.alert:first-child{border-top:0;padding-top:2px}
.alert .ic{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.alert b{display:block;font-size:14.5px}.alert .t{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.alert .row{margin-top:8px;flex-wrap:wrap;gap:6px}
.reccards{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 14px;padding:0 16px 6px;scrollbar-width:none}
.reccards::-webkit-scrollbar{display:none}
.rc{flex:0 0 74%;max-width:270px;scroll-snap-align:start;padding:12px;border-radius:15px;text-align:left;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-top:3px solid var(--c);box-shadow:0 -8px 24px -14px var(--c)}
.rc .a{font-family:var(--display);font-size:22px;letter-spacing:1px;color:var(--c)}
.rc .n{font-size:13.5px;font-weight:800;margin-top:2px}.rc .w{font-size:12.5px;color:var(--mute);margin-top:4px}
.disclaimer{font-size:12.5px;color:#ffd79a;background:rgba(255,176,32,.07);border:1px solid rgba(255,176,32,.3);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.goalgrid{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.goalgrid th,.goalgrid td{padding:7px 4px;text-align:right;border-top:1px solid var(--line)}
.goalgrid th:first-child,.goalgrid td:first-child{text-align:left;color:var(--mute)}
.goalgrid th{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.goalgrid .del{width:30px;height:30px;border-radius:9px;border:1px solid rgba(255,59,79,.3);color:var(--red)}
.wiz{margin-top:6px}
/* ---------- Fotos ---------- */
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#0b0d10;border:1px dashed var(--line2);display:grid;place-items:center;color:var(--dim);font-size:12px;text-align:center;line-height:1.5}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .pl{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.65);color:#fff}
.ph input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.cmpbox{position:relative;aspect-ratio:3/4;max-height:70vh;margin:12px auto 0;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line2);touch-action:none;user-select:none;-webkit-user-select:none}
.cmpbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.cmpbox .top{clip-path:inset(0 calc(100% - var(--x,50%)) 0 0)}
.cmpbox .div{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;background:var(--lime);box-shadow:0 0 12px var(--lime);transform:translateX(-1px);pointer-events:none}
.cmpbox .div::after{content:'⇆';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:var(--lime);color:#05060a;display:grid;place-items:center;font-weight:900;box-shadow:0 0 16px rgba(200,255,46,.6)}
.cmpbox .la,.cmpbox .lb{position:absolute;top:8px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.7)}
.cmpbox .la{left:8px}.cmpbox .lb{right:8px}
input[type=range]{padding:0;min-height:0;height:34px;accent-color:var(--lime);background:none;border:0;box-shadow:none}
@media (min-width:900px){main{padding:24px 16px}.hero h1{font-size:76px}}
@media (max-width:370px){.logo{font-size:25px}.weekchip{display:none}.stepper{grid-template-columns:42px 42px 1fr 42px 42px}.hero h1{font-size:56px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="top">

<script>
'use strict';
/* =====================================================================
   IRONLOG · registro de gimnasio offline-first
   Capas de seguridad de datos:
   1) IndexedDB local (cada cambio se escribe al instante, en transacción)
   2) Cola de subida (outbox) persistente → Supabase cuando hay red
   3) Last-write-wins por updated_at (cliente + guardián en el servidor)
   4) Borrado lógico (deleted_at) → papelera
   5) Instantáneas diarias (local + nube) y export/import JSON
   ===================================================================== */
const APP_VERSION = '2.0.0';
const LIBS = {
  supabase: 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js',
  chart: 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js'
};

/* ============================ UTILIDADES ============================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 8));
const pad2 = (n) => String(n).padStart(2, '0');
const dstr = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseD = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); };
const mondayOf = (s) => { const d = parseD(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dstr(d); };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const num = (v) => (v === null || v === undefined || String(v).trim() === '' ? NaN : parseFloat(String(v).replace(',', '.')));
const fmt = (n, dec = 1) => (Number.isFinite(n) ? n.toLocaleString('es-ES', { maximumFractionDigits: dec }) : '–');
const fmtKg = (n) => fmt(n, 2);
const fmtIn = (n) => (n === '' || n === null || n === undefined || !Number.isFinite(+n) ? '' : String(Math.round(n * 100) / 100).replace('.', ','));
const MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MONTHS_L = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const WDAYS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const fmtDate = (s) => { const d = parseD(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtDateL = (s) => { const d = parseD(s); return `${WDAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const fmtDur = (ms) => { const m = Math.max(0, Math.round(ms / 60000)); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; };
const fmtClock = (s) => `${Math.floor(s / 60)}:${pad2(s % 60)}`;
const fmtHMS = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600); return (h ? h + ':' + pad2(Math.floor(s / 60) % 60) : Math.floor(s / 60)) + ':' + pad2(s % 60); };
const fmtAgo = (ts) => { if (!ts) return 'nunca'; const s = (Date.now() - ts) / 1000; if (s < 60) return 'hace un momento'; if (s < 3600) return `hace ${Math.floor(s / 60)} min`; if (s < 86400) return `hace ${Math.floor(s / 3600)} h`; const d = Math.floor(s / 86400); return `hace ${d} ${d === 1 ? 'día' : 'días'}`; };
const e1rm = (w, r) => (!(w > 0) || !(r > 0) ? 0 : r === 1 ? w : w * (1 + r / 30)); // Epley
const clone = (o) => JSON.parse(JSON.stringify(o));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const stable = (v) => (v === null || typeof v !== 'object' ? JSON.stringify(v) : Array.isArray(v) ? '[' + v.map(stable).join(',') + ']' : '{' + Object.keys(v).sort().filter((k) => v[k] !== undefined).map((k) => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}');
const slug = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
const hexA = (hex, a) => { const h = hex.replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
const toISO = (ms) => (ms == null ? null : new Date(ms).toISOString());
const fromTS = (v) => (v == null ? null : typeof v === 'number' ? v : Date.parse(v));
function errMsg(e) {
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'No se pudo contactar con el servidor';
  if (/Invalid login credentials/i.test(m)) return 'Email o contraseña incorrectos';
  if (/Email not confirmed/i.test(m)) return 'Email sin confirmar (revisa tu correo o confírmalo en Supabase)';
  if (/gym_records|gym_backups/.test(m) && /does not exist|not find|schema cache/i.test(m)) return 'Faltan las tablas: ejecuta el SQL en Supabase';
  if (/JWT|token/i.test(m) && /expired|invalid/i.test(m)) return 'Sesión caducada: vuelve a entrar';
  if (/Invalid API key|No API key/i.test(m)) return 'Clave anon incorrecta';
  return m;
}
function loadLib(name) {
  if (loadLib.p[name]) return loadLib.p[name];
  loadLib.p[name] = new Promise((resolve) => {
    if (name === 'supabase' && window.supabase) return resolve(true);
    if (name === 'chart' && window.Chart) return resolve(true);
    const s = document.createElement('script');
    s.src = LIBS[name]; s.async = true; s.crossOrigin = 'anonymous';
    s.onload = () => resolve(true);
    s.onerror = () => { delete loadLib.p[name]; s.remove(); resolve(false); };
    document.head.appendChild(s);
  });
  return loadLib.p[name];
}
loadLib.p = {};

/* ============================ INDEXEDDB ============================ */
const DB = {
  db: null,
  open() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('Este navegador no tiene IndexedDB'));
      const req = indexedDB.open('ironlog', 2);
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains('records')) d.createObjectStore('records', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('outbox')) d.createObjectStore('outbox', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'k' });
        if (!d.objectStoreNames.contains('snapshots')) d.createObjectStore('snapshots', { keyPath: 'day' });
        if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs', { keyPath: 'id' }); // fotos (comprimidas)
      };
      req.onsuccess = () => { this.db = req.result; this.db.onversionchange = () => this.db.close(); resolve(); };
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('La base de datos está bloqueada por otra pestaña'));
    });
  },
  run(stores, mode, fn) {
    return new Promise((resolve, reject) => {
      if (!this.db) return reject(new Error('Base de datos local no disponible'));
      let tx;
      try { tx = this.db.transaction(stores, mode); } catch (e) { return reject(e); }
      let out;
      try { out = fn(tx); } catch (e) { try { tx.abort(); } catch (_) {} return reject(e); }
      tx.oncomplete = () => resolve(out instanceof IDBRequest ? out.result : out);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('Transacción cancelada'));
    });
  },
  getAll(s) { return this.run([s], 'readonly', (tx) => tx.objectStore(s).getAll()); },
  getAllKeys(s) { return this.run([s], 'readonly', (tx) => tx.objectStore(s).getAllKeys()); },
  get(s, k) { return this.run([s], 'readonly', (tx) => tx.objectStore(s).get(k)); },
  put(s, v) { return this.run([s], 'readwrite', (tx) => { tx.objectStore(s).put(v); }); },
  del(s, k) { return this.run([s], 'readwrite', (tx) => { tx.objectStore(s).delete(k); }); },
  // Guarda registros + su entrada en la cola de subida en UNA transacción atómica.
  saveRecords(recs, queue = true) {
    return this.run(['records', 'outbox'], 'readwrite', (tx) => {
      const R = tx.objectStore('records'); const O = tx.objectStore('outbox');
      for (const r of recs) { R.put(r); if (queue) O.put({ id: r.id, updated_at: r.updated_at }); }
    });
  },
  applyRemote(recs, dequeue) {
    return this.run(['records', 'outbox'], 'readwrite', (tx) => {
      const R = tx.objectStore('records'); const O = tx.objectStore('outbox');
      for (const r of recs) R.put(r);
      for (const id of dequeue) O.delete(id);
    });
  },
  dequeue(ids) { return this.run(['outbox'], 'readwrite', (tx) => { const O = tx.objectStore('outbox'); ids.forEach((id) => O.delete(id)); }); }
};

/* ============================ ALMACÉN EN MEMORIA ============================ */
const S = { recs: new Map(), outbox: new Map(), meta: {}, v: 0 };
let memo = {};
const cached = (k, fn) => { const m = memo[k]; if (m && m.v === S.v) return m.val; const val = fn(); memo[k] = { v: S.v, val }; return val; };
const get = (id) => S.recs.get(id);
const live = (id) => { const r = S.recs.get(id); return r && !r.deleted_at ? r : null; };
const byKind = (kind) => cached('k:' + kind, () => [...S.recs.values()].filter((r) => r.kind === kind && !r.deleted_at));
async function setMeta(k, v) { S.meta[k] = v; try { await DB.put('meta', { k, v }); } catch (e) { console.error(e); } }

/** Guarda varios registros. Devuelve las versiones anteriores (para "Deshacer"). */
async function saveMany(items) {
  const prevs = []; const recs = [];
  for (const it of items) {
    const prev = S.recs.get(it.id);
    prevs.push(prev ? clone(prev) : null);
    const now = Math.max(Date.now(), prev ? prev.updated_at + 1 : 0); // reloj monótono por registro
    const rec = {
      id: it.id, kind: it.kind || prev.kind,
      data: it.data !== undefined ? clone(it.data) : clone(prev ? prev.data : {}),
      updated_at: now,
      deleted_at: 'deleted_at' in it ? it.deleted_at : prev ? prev.deleted_at : null
    };
    S.recs.set(rec.id, rec); S.outbox.set(rec.id, rec.updated_at); recs.push(rec);
  }
  S.v++;
  try { await DB.saveRecords(recs); Status.saveOk(); } catch (e) { Status.saveFail(e); }
  Status.render(); Sync.soon();
  return prevs;
}
const save = async (kind, id, data, extra = {}) => (await saveMany([{ kind, id, data, ...extra }]))[0];
const softDelete = (ids) => saveMany([].concat(ids).map((id) => ({ id, kind: get(id).kind, deleted_at: Date.now() })));
async function revert(prevs, ids) {
  return saveMany(ids.map((id, i) => (prevs[i]
    ? { id, kind: prevs[i].kind, data: prevs[i].data, deleted_at: prevs[i].deleted_at }
    : { id, kind: get(id).kind, deleted_at: Date.now() })));
}
function undoToast(msg, prevs, ids) {
  toast(msg, { action: 'Deshacer', ms: 7000, onAction: async () => { await revert(prevs, ids); toast('Deshecho ✓', { type: 'ok' }); App.render(); Modal.refreshAll(); } });
}

/* ============================ RUTINA INICIAL ============================ */
const GROUPS = { pecho: 'Pecho', dorsales: 'Dorsales / espalda', hombros: 'Hombros', brazos: 'Brazos', core: 'Core' };
const DAY_COLORS = ['#2e8bff', '#a35bff', '#ff3b4f', '#c8ff2e', '#ff8a1f', '#19d3c5'];
const DEFAULT_PREFS = { activeBlockId: 'block-1', restHeavy: 150, restIso: 75, weeklyGoal: 3, sound: true, vibrate: true };
const EX_META = {
  'Press inclinado con mancuernas': ['pecho', 'heavy'], 'Peck Deck': ['pecho', 'iso'], 'Jalón al pecho': ['dorsales', 'heavy'],
  'Remo en polea': ['dorsales', 'heavy'], 'Elevaciones laterales': ['hombros', 'iso'], 'Curl de bíceps en máquina': ['brazos', 'iso'],
  'Tríceps en polea': ['brazos', 'iso'], 'Crunch en polea': ['core', 'iso'], 'Reverse Pec Deck': ['hombros', 'iso'],
  'Curl martillo en polea': ['brazos', 'iso'], 'Tríceps por encima de la cabeza': ['brazos', 'iso'], 'Elevaciones de piernas': ['core', 'iso'],
  'Press de pecho en máquina': ['pecho', 'heavy']
};
const SEED_DAYS = [
  { name: 'Pecho + dorsal + espalda', focus: 'Prioridad: pecho superior + dorsales + fuerza', items: [
    ['Press inclinado con mancuernas', 'semi-neutro', 3, 6, 10], ['Peck Deck', 'estándar', 3, 8, 12],
    ['Jalón al pecho', 'pronado, algo más ancho que hombros', 3, 6, 10], ['Remo en polea', 'cerrado, neutro', 3, 8, 12],
    ['Elevaciones laterales', 'mancuernas, neutro', 3, 12, 20], ['Curl de bíceps en máquina', 'supino', 2, 8, 12],
    ['Tríceps en polea', 'barra V', 2, 8, 12], ['Crunch en polea', '', 2, 10, 15]] },
  { name: 'Espalda + hombros + pecho', focus: 'Prioridad: V-taper + deltoide lateral/posterior', items: [
    ['Remo en polea', 'cerrado, neutro', 3, 6, 10], ['Press inclinado con mancuernas', 'semi-neutro', 3, 8, 12],
    ['Jalón al pecho', 'neutro, cerrado', 3, 8, 12], ['Reverse Pec Deck', 'estándar', 3, 12, 20],
    ['Elevaciones laterales', 'mancuernas, neutro', 3, 12, 20], ['Curl martillo en polea', 'cuerda', 2, 8, 12],
    ['Tríceps por encima de la cabeza', 'cuerda', 2, 8, 12], ['Elevaciones de piernas', '', 2, 10, 15]] },
  { name: 'Pecho + espalda + brazos', focus: 'Prioridad: pecho completo + congestión + brazos', items: [
    ['Peck Deck', 'estándar', 3, 8, 12], ['Press de pecho en máquina', 'neutro si existe', 3, 8, 12],
    ['Jalón al pecho', 'pronado, agarre medio', 3, 8, 12], ['Remo en polea', 'abierto, pronado', 3, 8, 12],
    ['Elevaciones laterales', 'mancuernas, neutro', 3, 12, 20], ['Curl de bíceps en máquina', 'supino', 2, 10, 15],
    ['Tríceps en polea', 'barra V', 2, 10, 15], ['Crunch en polea', '', 2, 10, 15]] }
];
const seedExId = (name, grip) => 'ex-' + slug(name + ' ' + grip);
async function seedIfEmpty() {
  if (S.recs.size) return;
  // Fecha antigua a propósito: cualquier dato real (local o de la nube) siempre gana a la semilla.
  // Los IDs son fijos, así que la semilla de otro dispositivo nunca duplica nada.
  const T = Date.UTC(2020, 0, 1);
  const recs = []; const add = (kind, id, data) => recs.push({ id, kind, data, updated_at: T, deleted_at: null });
  const seen = new Set();
  SEED_DAYS.forEach((d) => d.items.forEach(([name, grip]) => {
    const id = seedExId(name, grip); if (seen.has(id)) return; seen.add(id);
    const [group, type] = EX_META[name]; add('exercise', id, { name, grip, group, type });
  }));
  add('block', 'block-1', { name: 'Bloque 1', start: mondayOf(dstr()), weeks: 10 });
  SEED_DAYS.forEach((d, i) => add('day', 'day-b1-' + (i + 1), {
    blockId: 'block-1', num: i + 1, name: d.name, focus: d.focus, color: DAY_COLORS[i], order: i,
    items: d.items.map(([name, grip, sets, min, max]) => ({ exId: seedExId(name, grip), sets, min, max, rest: null }))
  }));
  add('prefs', 'prefs', { ...DEFAULT_PREFS });
  for (const r of recs) { S.recs.set(r.id, r); S.outbox.set(r.id, r.updated_at); }
  S.v++;
  try { await DB.saveRecords(recs); } catch (e) { Status.saveFail(e); }
}

/* ============================ CONSULTAS ============================ */
const prefs = () => ({ ...DEFAULT_PREFS, ...((live('prefs') || {}).data || {}) });
const savePrefs = (patch) => save('prefs', 'prefs', { ...prefs(), ...patch });
const exRec = (id) => get(id);
const exLabel = (id, fallback) => { const e = exRec(id); const n = e ? e.data.name : fallback ? fallback.name : 'Ejercicio'; const g = e ? e.data.grip : fallback ? fallback.grip : ''; return g ? `${n} · ${g}` : n; };
const blocks = () => byKind('block').slice().sort((a, b) => a.data.start.localeCompare(b.data.start));
const activeBlock = () => live(prefs().activeBlockId) || blocks().at(-1) || null;
const daysOf = (blockId) => byKind('day').filter((d) => d.data.blockId === blockId).sort((a, b) => a.data.order - b.data.order);
const sessions = () => cached('sess', () => byKind('session').slice().sort((a, b) => b.data.date.localeCompare(a.data.date) || b.data.startedAt - a.data.startedAt));
const doneSessions = () => sessions().filter((s) => s.data.status === 'done');
const activeSession = () => sessions().find((s) => s.data.status === 'active') || null;
const setsIndex = () => cached('sets', () => {
  const m = new Map();
  for (const r of byKind('set')) { const k = r.data.sessionId; if (!m.has(k)) m.set(k, []); m.get(k).push(r); }
  for (const a of m.values()) a.sort((x, y) => x.data.n - y.data.n || x.data.at - y.data.at);
  return m;
});
const setsOf = (sid, exId) => { const a = setsIndex().get(sid) || []; return exId ? a.filter((r) => r.data.exId === exId) : a; };
/** Historial de un ejercicio: [{s, sets}] de sesiones vivas, de más antigua a más reciente. */
const exHistory = (exId) => cached('h:' + exId, () => {
  const out = [];
  for (const s of sessions()) { const st = setsOf(s.id, exId); if (st.length) out.push({ s, sets: st }); }
  return out.reverse();
});
const lastFor = (exId, excludeSid) => { const h = exHistory(exId); for (let i = h.length - 1; i >= 0; i--) if (h[i].s.id !== excludeSid) return h[i]; return null; };
function bests(exId, filter = () => true) {
  const b = { w: 0, wAt: null, e: 0, eAt: null, eSet: '', v: 0, vAt: null, any: false };
  for (const { s, sets } of exHistory(exId)) {
    let vol = 0, used = false;
    for (const st of sets) {
      if (!filter(st, s)) continue;
      const W = +st.data.w || 0, R = +st.data.r || 0; if (R <= 0) continue;
      used = true; b.any = true; vol += W * R;
      if (W > b.w) { b.w = W; b.wAt = s.data.date; }
      const E = e1rm(W, R); if (E > b.e) { b.e = E; b.eAt = s.data.date; b.eSet = `${fmtKg(W)} × ${R}`; }
    }
    if (used && vol > b.v) { b.v = vol; b.vAt = s.data.date; }
  }
  return b;
}
const restFor = (item) => { const p = prefs(); return +item.rest || (item.type === 'heavy' ? p.restHeavy : p.restIso); };
const setsLine = (sets) => sets.map((x) => `${fmtKg(x.data.w)}×${x.data.r}`).join(' · ');
function sessionStats(s) {
  const sets = setsOf(s.id); let vol = 0, reps = 0;
  for (const x of sets) { vol += (+x.data.w || 0) * (+x.data.r || 0); reps += +x.data.r || 0; }
  return { vol, reps, sets: sets.length, dur: (s.data.endedAt || Date.now()) - s.data.startedAt };
}
const isBefore = (o, s) => o.data.date < s.data.date || (o.data.date === s.data.date && o.data.startedAt < s.data.startedAt);

function nextDay() {
  const b = activeBlock(); if (!b) return null;
  const days = daysOf(b.id); if (!days.length) return null;
  const last = doneSessions().find((s) => days.some((d) => d.id === s.data.dayId));
  if (!last) return days[0];
  const i = days.findIndex((d) => d.id === last.data.dayId);
  return days[(i + 1) % days.length];
}
function blockWeek(b = activeBlock()) {
  if (!b) return null;

const KIND_TABLE = { profile: 'gym_profile', goal: 'gym_profile', measure: 'gym_measurements', photo: 'gym_photos', checkin: 'gym_checkins', weekly: 'gym_checkins', chat: 'gym_coach', proposal: 'gym_coach', analysis: 'gym_coach', secret: 'gym_secrets' };

  cfg() { try { return JSON.parse(localStorage.getItem('ironlog-cfg') || 'null') || S.meta.cfg || null; } catch (e) { return S.meta.cfg || null; } },
  configured() { const c = this.cfg(); return !!(c && c.url && c.key); },
  async setCfg(c) { try { localStorage.setItem('ironlog-cfg', JSON.stringify(c)); } catch (e) { /* nada */ } await setMeta('cfg', c); },
  async init() {
    if (this.sub) { try { this.sub.unsubscribe(); } catch (e) { /* nada */ } this.sub = null; }
    this.client = null; this.session = null; this.lastError = null;

    try {
      this.client = window.supabase.createClient(c.url.trim(), c.key.trim(), { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'ironlog-auth' } });

      this.session = session; Status.render();
      if (ev === 'SIGNED_IN' || ev === 'TOKEN_REFRESHED') this.soon(150);

    this.busy = true; Status.render();
    try {
      this.missing = new Set();
      await this.push();
      await this.pull();
      await this.push();
      this.lastError = this.missing.size ? `Faltan tablas nuevas en Supabase (${[...this.missing].join(', ')}): ejecuta supabase-v2.sql` : null;
      await setMeta('lastSyncOk', Date.now());

  },
  async push() {
    const uid = this.session.user.id;

    let guard = 0; let ids;

  async signIn(email, password) { const { error } = await this.client.auth.signInWithPassword({ email, password }); if (error) throw error; },
  async signUp(email, password) { const { data, error } = await this.client.auth.signUp({ email, password }); if (error) throw error; return data; },
  async signOut() { await this.client.auth.signOut(); this.session = null; Status.render(); }
};

const Backup = {
  payload() {

  },
  async localDaily(force = false) {
    const day = dstr();

    try {
      const p = this.payload();
      await DB.put('snapshots', { day, createdAt: Date.now(), count: p.count, payload: p });
      const keys = (await DB.getAllKeys('snapshots')).sort();
      for (const k of keys.slice(0, Math.max(0, keys.length - 30))) await DB.del('snapshots', k);
      await setMeta('lastLocalSnap', day);
    } catch (e) { console.error('Snapshot local', e); }
  },
  async cloudDaily(force = false) {
    const day = dstr();
    if (!Sync.ready() || (!force && S.meta.lastCloudSnap === day && !S.meta.cloudSnapDirty)) return;
    const p = this.payload();
    const { error } = await Sync.client.from('gym_backups').upsert({ user_id: Sync.session.user.id, day, record_count: p.count, payload: p, created_at: new Date().toISOString() }, { onConflict: 'user_id,day' });
    if (error) throw error;
    await setMeta('lastCloudSnap', day); await setMeta('cloudSnapDirty', false);
  },
  download(obj, name) {

    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  },
  fileName: () => `ironlog-backup-${dstr()}.json`,
  async exportNow() {
    this.download(this.payload(), this.fileName());
    await setMeta('lastExport', Date.now());
    toast('Copia descargada ✓ Guárdala en Drive/iCloud', { type: 'ok' }); App.render();
  },
  async shareNow() {
    const file = new File([JSON.stringify(this.payload())], this.fileName(), { type: 'application/json' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Copia IronLog' });
        await setMeta('lastExport', Date.now()); toast('Copia compartida ✓', { type: 'ok' }); App.render();
      } else { await this.exportNow(); }

  /** Fusiona registros sin duplicar (por id). Por defecto gana el más nuevo; force=true impone la copia. */

    let added = 0, updated = 0, same = 0; const recs = [];
    for (const raw of list || []) {

        recs.push({ id: raw.id, kind: raw.kind, data, updated_at: Math.max(Date.now(), (loc ? loc.updated_at : 0) + 1), deleted_at: del });
        loc ? updated++ : added++; continue;
      }
      if (!loc) { added++; recs.push({ id: raw.id, kind: raw.kind, data, updated_at: ts, deleted_at: del }); }

function calendarHtml() {

function viewProgreso() {

    const cw = Math.min(Math.max(bw.w, 1), bw.weeks);
    const w = Math.min(Math.max(cw + ui.volOffset, 1), bw.weeks);

    const gv = groupVolume(from, to); const plan = plannedPerGroup(b);

      <h2 style="font-size:40px;margin-top:4px">${bw.before ? `Empieza en ${bw.inDays} ${bw.inDays === 1 ? 'día' : 'días'}` : bw.after ? 'Bloque completado' : `Semana ${bw.w} de ${bw.weeks}`}</h2>

      ${['hombros', 'dorsales', 'pecho', 'brazos', 'core'].map((g) => {
        const done = gv[g] ? gv[g].sets : 0; const target = plan[g] || 0; const pct = target ? Math.min(100, (100 * done) / target) : done ? 100 : 0;
        const col = { hombros: '#ffb020', dorsales: '#2e8bff', pecho: '#ff3b4f', brazos: '#a35bff', core: '#35e38c' }[g];

    exCard = `<div class="card" style="--day:${color}">
      <label class="f" style="margin-top:0">Ejercicio (cada agarre es una variante)</label>
      <select data-ch="exSel">${exs.map((e) => `<option value="${e.id}" ${e.id === ex.id ? 'selected' : ''}>${esc(exLabel(e.id))}${exHistory(e.id).length ? ` (${exHistory(e.id).length})` : ''}</option>`).join('')}</select>
      <div class="medals">
        <div class="medal"><div class="ic">🥇</div><div class="v num">${bt.any ? fmtKg(bt.w) : '–'}</div><div class="l">Mejor peso</div><div class="d">${bt.wAt ? fmtDate(bt.wAt) : ''}</div></div>
        <div class="medal"><div class="ic">🏆</div><div class="v num">${bt.any ? fmt(bt.e, 1) : '–'}</div><div class="l">1RM estimado</div><div class="d">${bt.eSet ? bt.eSet : ''}</div></div>
        <div class="medal"><div class="ic">💪</div><div class="v num">${bt.any ? fmt(bt.v, 0) : '–'}</div><div class="l">Volumen</div><div class="d">${bt.vAt ? fmtDate(bt.vAt) : ''}</div></div>

      <div class="seg">${[['w', 'Peso máx'], ['e', '1RM est.'], ['v', 'Volumen']].map(([k, l]) => `<button class="${ui.metric === k ? 'on' : ''}" data-act="metric" data-v="${k}">${l}</button>`).join('')}</div>

      <div class="chartbox"><canvas id="bwChart"></canvas>${!bws.length ? '<div class="empty">Registra tu peso para ver la gráfica</div>' : ''}</div>
      ${bws.slice(-6).reverse().map((x) => `<div class="hrow"><span>${fmtDateL(x.data.date)}</span><span class="row" style="gap:10px"><b class="num">${fmtKg(x.data.kg)} kg</b><button class="btn sm danger" data-act="delBw" data-id="${x.id}" aria-label="Borrar">🗑</button></span></div>`).join('')}
    </div>`;
}
function lineChart(id, labels, data, color, unit) {
  const cv = document.getElementById(id); if (!cv) return;
  if (!window.Chart) {
    cv.insertAdjacentHTML('afterend', '<div class="empty">Cargando gráficas… (necesita conexión la primera vez)</div>');
    loadLib('chart').then((ok) => { if (ok && App.view === 'progreso') App.render(); });
    return;
  }
  const ctx = cv.getContext('2d'); const g = ctx.createLinearGradient(0, 0, 0, 230);
  g.addColorStop(0, hexA(color, 0.35)); g.addColorStop(1, hexA(color, 0));
  charts.push(new window.Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [{ data, borderColor: color, backgroundColor: g, fill: true, tension: 0.35, pointRadius: 3.5, pointHoverRadius: 6, pointBackgroundColor: color, pointBorderColor: '#060708', pointBorderWidth: 2, borderWidth: 2.5 }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 700, easing: 'easeOutQuart' },
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { backgroundColor: '#16191e', borderColor: 'rgba(255,255,255,.14)', borderWidth: 1, titleColor: '#8d95a1', bodyColor: '#f3f5f8', bodyFont: { weight: '700', size: 14 }, padding: 10, displayColors: false, callbacks: { label: (c) => `${fmt(c.parsed.y, 1)} ${unit}` } } },
      scales: { x: { grid: { display: false }, ticks: { color: '#5d646f', maxRotation: 0, autoSkip: true, maxTicksLimit: 6 } }, y: { grid: { color: 'rgba(255,255,255,.05)' }, border: { display: false }, ticks: { color: '#5d646f', maxTicksLimit: 5 } } }
    }
  }));
}

/* ============================ MOTOR DE PROGRESIÓN (reglas, determinista) ============================
   Nada de IA aquí: mismas entradas → misma recomendación. Cada salida lleva su "porqué". */
const round2 = (x) => Math.round(x * 100) / 100;
const roundInc = (x, inc) => round2(Math.round(x / inc) * inc);
const avg = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const addMonths = (s, m) => { const d = parseD(s); d.setMonth(d.getMonth() + m); return dstr(d); };
function incOf(exId) {
  const e = exRec(exId); const v = e ? +e.data.inc : 0;
  if (v > 0) return v;
  const t = e ? `${e.data.name} ${e.data.grip || ''}` : '';
  return /mancuerna/i.test(t) ? 2 : 2.5;
}
function sessionPerf(sets, item) {
  const ws = sets.slice(0, item.sets);
  const W = ws.length ? Math.max(...ws.map((x) => +x.data.w || 0)) : 0;
  const reps = ws.map((x) => +x.data.r || 0);
  const e = sets.length ? Math.max(...sets.map((x) => e1rm(+x.data.w, +x.data.r))) : 0;
  const repsAtW = ws.filter((x) => (+x.data.w || 0) === W).reduce((a, x) => a + (+x.data.r || 0), 0);
  return { W, reps, rirs: ws.map((x) => x.data.rir), e, repsAtW, n: ws.length };
}
/** Sesiones consecutivas (las más recientes) sin mejorar ni peso ni reps. */
function plateauCount(hist, item) {
  let bestW = -1; const bestAt = new Map(); let since = 0;
  hist.forEach((h, i) => {
    const p = sessionPerf(h.sets, item); const prevAt = bestAt.get(p.W);
    const improved = i === 0 || p.W > bestW || (prevAt != null && p.repsAtW > prevAt);
    since = improved ? 0 : since + 1;
    bestW = Math.max(bestW, p.W); bestAt.set(p.W, Math.max(prevAt || 0, p.repsAtW));
  });
  return since;
}
function recommend(item, sid) {
  return cached(`rec:${item.exId}|${sid}|${item.sets}|${item.min}|${item.max}|${item.type}`, () => recommendRaw(item, sid));
}
function recommendRaw(item, sid) {
  const inc = incOf(item.exId); const heavy = item.type === 'heavy';
  const rirTxt = heavy ? 'dejando 1-3 reps en reserva' : 'cerca del fallo en la última serie';
  const range = `${item.min}-${item.max}`;
  const hist = exHistory(item.exId).filter((h) => h.s.id !== sid);
  const n = hist.length;
  const conf = { n, lv: n === 0 ? 0 : n === 1 ? 1 : n < 4 ? 2 : 3 };
  conf.t = ['Sin datos', 'Baja', 'Media', 'Alta'][conf.lv];
  const base = { inc, conf, plateau: 0 };
  if (!n) {
    return { ...base, c: 'new', action: 'start', label: 'Primera vez', weight: null, reps: Array(item.sets).fill(item.min),
      text: `Busca un peso para ${range} reps ${rirTxt}.`,
      why: ['Aún no hay registros de esta variante: no hay base para calcular.', `Objetivo: ${item.sets} series de ${range} reps ${rirTxt}.`, 'Tras esta sesión el motor ya podrá recomendarte el peso exacto.'] };
  }
  const last = hist[n - 1]; const p = sessionPerf(last.sets, item);
  const prev = n > 1 ? sessionPerf(hist[n - 2].sets, item) : null;
  const W = p.W; const wTxt = W > 0 ? `${fmtKg(W)} kg` : 'peso corporal';
  const rirs = p.rirs.some((r) => r != null) ? ` (RIR ${p.rirs.map((r) => (r == null ? '–' : r)).join('/')})` : '';
  const lastLine = `La última vez (${fmtDate(last.s.data.date)}): ${wTxt} — ${p.reps.join('/')}${rirs}`;
  const pr = prefs();
  if (pr.deloadUntil && dstr() <= pr.deloadUntil) {
    const dw = W > 0 ? roundInc(W * 0.9, inc) : 0; const ds = Math.max(1, item.sets - 1);
    return { ...base, c: 'deload', action: 'deload', label: 'Descarga', weight: W > 0 ? dw : null, reps: Array(ds).fill(item.min),
      text: `Descarga: ${W > 0 ? fmtKg(dw) + ' kg, ' : ''}${ds} series, RIR 3-4.`,
      why: [lastLine, `Semana de descarga aceptada (hasta el ${fmtDate(pr.deloadUntil)}).`, `~90% del peso${W > 0 ? ` (${fmtKg(dw)} kg)` : ''}, ${ds} ${ds === 1 ? 'serie' : 'series'} y RIR 3-4 para recuperar.`] };
  }
  // 1) BAJAR: por debajo del mínimo 2 sesiones seguidas, o 1RM estimado -5% o más
  const win = hist.slice(Math.max(0, n - 4), n - 1).map((h) => sessionPerf(h.sets, item).e);
  const priorE = win.length ? Math.max(...win) : 0;
  const drop = priorE > 0 && p.e > 0 ? (priorE - p.e) / priorE : 0;
  const belowLast = p.reps.some((r) => r < item.min); const belowPrev = !!prev && prev.reps.some((r) => r < item.min);
  if ((belowLast && belowPrev) || drop >= 0.05) {
    const lo = W > 0 ? roundInc(W * 0.9, inc) : 0; const hi = W > 0 ? roundInc(W * 0.95, inc) : 0;
    let nw = W > 0 ? roundInc(W * 0.925, inc) : 0; if (W > 0 && nw >= W) nw = Math.max(0, round2(W - inc));
    const why = [lastLine];
    if (belowLast && belowPrev) why.push(`Por debajo del mínimo (${item.min}) dos sesiones seguidas: ${prev.reps.join('/')} → ${p.reps.join('/')}.`);
    if (drop >= 0.05) why.push(`1RM estimado ${fmt(p.e, 1)} kg: un ${fmt(drop * 100, 0)}% menos que tu mejor reciente (${fmt(priorE, 1)} kg).`);
    why.push(W > 0 ? `Regla: bajar 5-10% (${fmtKg(lo)}–${fmtKg(hi)} kg) y reconstruir hasta ${item.max} reps.` : 'Regla: reduce la dificultad y reconstruye el rango.');
    return { ...base, c: 'warn', action: 'down', label: 'Baja peso', weight: W > 0 ? nw : null, reps: Array(item.sets).fill(Math.min(item.max, item.min + 2)),
      text: W > 0 ? `Baja a ${fmtKg(nw)} kg y reconstruye.` : 'Reduce la dificultad y reconstruye.', why };
  }
  // 2) SUBIR: tope del rango en todas las series con el RIR objetivo
  if (p.n >= item.sets && p.reps.every((r) => r >= item.max)) {
    const failed = last.sets.slice(0, item.sets).filter((x) => heavy && x.data.rir != null && +x.data.rir < 1).length;
    if (failed) {
      return { ...base, c: 'hold', action: 'hold', label: 'Consolida', weight: W > 0 ? W : null, reps: Array(item.sets).fill(item.max),
        text: `Repite ${wTxt} con RIR 1-3 antes de subir.`,
        why: [lastLine, `Tope del rango (${item.max}) alcanzado, pero ${failed} ${failed === 1 ? 'serie' : 'series'} al fallo (RIR 0). En pesados el objetivo es RIR 1-3.`, `Repite ${wTxt} y logra ${item.max} reps dejando 1-3 en reserva; entonces sube.`] };
    }
    const nw = W > 0 ? round2(W + inc) : null;
    const rirNote = heavy ? (p.rirs.some((r) => r != null) ? ' con el RIR objetivo (≥1)' : ' (sin RIR anotado: se asume correcto)') : '';
    return { ...base, c: 'go', action: 'up', label: '¡Sube peso!', weight: nw, reps: Array(item.sets).fill(item.min),
      text: W > 0 ? `Prueba ${fmtKg(nw)} kg (+${fmtKg(inc)}).` : 'Añade carga o dificultad.',

function computeGoal(a) {

  const m0 = a.measures || {}; const r1 = (x) => Math.round(x * 10) / 10; const r05 = (x) => Math.round(x * 2) / 2;
  const targets = months.map((mo) => {
    let dBw = bwM * mo; if (a.approach === 'definicion') dBw = Math.max(dBw, -bw * 0.12);
    const muscle = muscleM * mo; const fat = dBw - muscle;

    if (m0.shoulders) t.shoulders = r05(+m0.shoulders + muscle * 1.0);
    if (m0.chest) t.chest = r05(+m0.chest + muscle * 0.8);
    if (m0.arm) t.arm = r05(+m0.arm + muscle * 0.35);

}

function detectPatterns() {
  const out = []; const today = dstr();
  const cis = byKind('checkin').slice().sort((a, b) => b.data.date.localeCompare(a.data.date));
  const pain = cis.find((c) => c.data.pain === 'dolor' && daysBetween(c.data.date, today) <= 10);
  if (pain) out.push({ ic: '🩹', lv: 'red', t: 'Has reportado dolor', x: `El ${fmtDate(pain.data.date)}${pain.data.painNote ? ` (${pain.data.painNote})` : ''}. Si persiste, para el ejercicio que lo provoca y consulta a un profesional sanitario.` });
  const r3 = cis.slice(0, 3);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && Modal.stack.length) Modal.close();
  if (e.key === 'Enter' && e.target.matches('.setopen input')) { e.preventDefault(); const b = e.target.closest('.setopen').querySelector('[data-act="saveSet"]'); if (b) b.click(); }
  if (e.key === 'Enter' && e.target.id === 'bwIn') { e.preventDefault(); ACT.saveBw(); }
  if (e.key === 'Enter' && e.target.id === 'loginPass') { e.preventDefault(); $('[data-act="login"]').click(); }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'chatIn') { e.preventDefault(); ACT.chatSend(); }
});
document.addEventListener('pointerdown', () => Sound.unlock(), { passive: true });
$('#importFile').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const list = Backup.parse(await f.text());
    if (!(await confirmDlg('¿Importar copia?', `${f.name}: ${list.length} registros. Se fusionará con tus datos sin duplicar y sin pisar nada más nuevo.`, { ok: 'Importar' }))) return;
    const r = await Backup.merge(list);
    toast(`Importado: ${r.added} nuevos, ${r.updated} actualizados, ${r.same} sin cambios`, { type: 'ok', ms: 6000 }); App.render();
  } catch (err) { toast('No se pudo importar: ' + errMsg(err), { type: 'err', ms: 6000 }); }
});
window.addEventListener('online', () => { Status.render(); if (!Sync.client && Sync.configured()) Sync.init(); else Sync.soon(300); });
window.addEventListener('offline', () => Status.render());
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== App.view && VIEWS[v]) App.go(v); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { Sync.soon(300); Timer.paint(); WakeLock.on(); if (App.view === 'hoy' && !activeSession()) App.render(); }
});
setInterval(() => { const el = $('#elapsed'); const s = activeSession(); if (el && s) el.textContent = fmtHMS(Date.now() - s.data.startedAt); }, 1000);
setInterval(() => Sync.soon(0), 60000);

/* ============================ ARRANQUE ============================ */
(async function boot() {
  try { await DB.open(); }
  catch (e) {
    $('#view').innerHTML = `<div class="banner red">No se puede usar el almacenamiento local (${esc(errMsg(e))}). Usa el navegador normal (no modo incógnito).</div>`;
    Status.saveErr = e;
  }
  if (DB.db) {
    const [recs, out, meta] = await Promise.all([DB.getAll('records'), DB.getAll('outbox'), DB.getAll('meta')]);
    for (const r of recs) S.recs.set(r.id, r);
    for (const o of out) S.outbox.set(o.id, o.updated_at);
    for (const m of meta) S.meta[m.k] = m.v;
    S.v++;
  }
  if (!localStorage.getItem('ironlog-cfg') && S.meta.cfg) { try { localStorage.setItem('ironlog-cfg', JSON.stringify(S.meta.cfg)); } catch (e) { /* nada */ } }
  await seedIfEmpty();
  Timer.restore();
  const s = activeSession(); if (s) $('#timer').style.setProperty('--day', s.data.color);
  App.go(VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'hoy');
  Status.render();
  WakeLock.on();
  Persist.ensure().then(() => { if (App.view === 'ajustes') App.render(); });
  Backup.localDaily();
  Sync.init();
  loadLib('chart');
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW', e));
  }
})();
</script>
</body>
</html>
